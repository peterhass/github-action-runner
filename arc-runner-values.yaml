# githubConfigUrl is supplied by github-actions-runner configure.
githubConfigSecret: github-actions-runner
runnerScaleSetName: self-hosted-k3s
minRunners: 0
maxRunners: 6

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # Root here maps to the unprivileged K3s user on the host. This also
        # preserves that user's access to /dev/kvm through the user namespace.
        securityContext:
          runAsUser: 0
        env:
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
        volumeMounts:
          - name: kvm
            mountPath: /dev/kvm
    volumes:
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
